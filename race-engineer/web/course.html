<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GT7 Race Engineer – Course</title>
<meta name="theme-color" content="#0c0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GT7 Course">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Jour de course : quatre grands chiffres lisibles d'un coup d'œil, une bannière d'arrêt quand il faut rentrer */
:root{
  --bg:#07090c; --panel:#11161c; --panel-2:#1a2129; --line:#222b35; --fg:#f1f4f7; --muted:#8a96a3;
  --accent:#ff3b4e; --ok:#3ddc84; --warn:#ffc833; --cold:#4fa8ff;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-display);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{display:flex;flex-direction:column;gap:10px;height:100vh;height:100dvh;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
nav.tabs3{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px}
nav.tabs3 a{color:var(--muted);text-decoration:none;font:600 15px var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:6px 12px;border-radius:4px}
nav.tabs3 a[aria-current=page]{background:var(--fg);color:var(--bg)}
nav.tabs3 a.cog{display:flex;align-items:center;padding:6px 10px}
nav.tabs3 a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
.tools>*{flex:none}
.pill{white-space:nowrap;font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:3px;display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.live{background:rgba(61,220,132,.14);color:var(--ok)}.pill.demo{background:rgba(255,200,51,.14);color:var(--warn)}.pill.wait{background:rgba(138,150,163,.16);color:var(--muted)}
.btn{background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font:600 14px var(--f-display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* bannière d'arrêt */
.box{border-radius:8px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.box b{font:700 clamp(34px,8vw,64px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.box span{font:600 clamp(16px,3.6vw,24px) var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.box.crit{background:var(--accent);color:#fff;animation:pulse 1s steps(2,end) infinite}
.box.warn{background:var(--warn);color:#07090c}
@keyframes pulse{50%{background:#8f1220}}
@media (prefers-reduced-motion:reduce){.box.crit{animation:none}}

/* quatre tuiles */
/* portrait : carburant | course, puis chrono et pneus sur toute la largeur ; paysage : une seule ligne */
.tiles{flex:1;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1.15fr 1fr 1fr;
  grid-template-areas:"fuel lap" "time time" "tyre tyre";--big:clamp(40px,min(16vw,12vh),230px);--time:clamp(34px,min(18.5vw,11vh),210px)}
@media (orientation:landscape){.tiles{grid-template-columns:1fr 1.45fr 1fr 1fr;grid-template-rows:1fr;grid-template-areas:"fuel time lap tyre";
  --big:clamp(34px,min(7vw,24vh),190px);--time:clamp(30px,min(5.4vw,20vh),170px)}}
/* tablette en paysage : grille 2 × 2, chiffres plus grands */
@media (orientation:landscape) and (min-height:600px){.tiles{grid-template-columns:1fr 1.35fr;grid-template-rows:1fr 1fr;
  grid-template-areas:"fuel time" "lap tyre";--big:clamp(40px,min(13vw,17vh),230px);--time:clamp(34px,min(10.5vw,15vh),210px)}}
#tFuel{grid-area:fuel}#tTime{grid-area:time}#tLap{grid-area:lap}#tTyre{grid-area:tyre}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-width:0;min-height:0;overflow:hidden}
.lbl{font:600 clamp(13px,2.4vw,17px) var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 8px}
.lbl span{white-space:nowrap}
@media (orientation:landscape) and (max-height:500px){.lbl{font-size:13px;letter-spacing:.06em}}
.val{display:flex;flex-direction:column;gap:.35em}
.huge{font:700 var(--big)/1.05 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;white-space:nowrap}
.sub{font:600 clamp(18px,3.6vw,28px) var(--f-mono);font-variant-numeric:tabular-nums}
.unit{font:600 clamp(15px,2.8vw,20px) var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ok{color:var(--ok)}.bad{color:var(--accent)}.wrn{color:var(--warn)}
.legend{display:inline-flex;align-items:center;gap:4px;letter-spacing:.04em}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-left:4px}
.gauge{height:12px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;min-height:0}
.tyre{border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 clamp(26px,6vw,44px) var(--f-mono);color:#07090c;min-height:0;transition:background .4s}
.waitbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:18px;gap:6px}
.waitbox b{font:700 28px var(--f-display);text-transform:uppercase;color:var(--fg)}
/* barre d'onglets centrée, boutons à droite ; sur écran étroit, les boutons passent dessous */
header{display:grid!important;grid-template-columns:1fr auto 1fr;grid-template-areas:". nav tools";align-items:center;gap:8px}
header nav.tabs3{grid-area:nav}
header .tools,header .hdr-right{grid-area:tools;justify-self:end}
@media (max-width:760px){header{grid-template-columns:1fr;grid-template-areas:"nav" "tools"}header nav.tabs3,header .tools,header .hdr-right{justify-self:center}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <nav class="tabs3" aria-label="Écrans">
    <a href="course.html" aria-current="page">Course</a>
    <a href="pilote.html">Pilote</a>
    <a href="./">Complet</a>
    <a href="strategie.html">Stratégie</a>
    <a href="reglages.html" class="cog" aria-label="Réglages" title="Réglages"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="display:block"><path fill="currentColor" d="M18.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L14 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L5.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></a>
  </nav>
  <div class="tools">
    <span class="pill wait" id="status">Connexion…</span>
    <button class="btn" id="voiceBtn" type="button" aria-pressed="false" aria-label="Ingénieur vocal">🎧 Off</button>
  </div>
</header>

<div class="box" id="box" hidden><b id="boxTitle">Box box</b><span id="boxText"></span></div>

<div class="waitbox" id="waitBox" hidden><b>En attente de la PS5</b>Lance une course ou un essai dans GT7.</div>

<main class="tiles" id="tiles">
  <section class="tile" id="tFuel">
    <div class="lbl"><span>Carburant</span><span id="fuelL">– L</span></div>
    <div class="val"><div class="huge" id="fuelLaps">–</div><div class="unit">tours restants · <span id="cons">– L/tour</span></div></div>
    <div class="gauge"><i id="gauge" style="width:0"></i></div>
  </section>
  <section class="tile" id="tTime">
    <div class="lbl"><span>Dernier tour</span><span id="best">meilleur –</span></div>
    <div class="huge" id="last" style="font-size:var(--time)">–</div>
    <div class="sub" id="delta">–</div>
  </section>
  <section class="tile" id="tLap">
    <div class="lbl"><span>Course</span><span id="raceType"></span></div>
    <div class="val"><div class="huge" id="lap" style="font-size:calc(var(--big) * var(--lapk,1))">–</div><div class="unit" id="lapUnit">tour</div></div>
    <div class="sub" id="pos">–</div>
  </section>
  <section class="tile" id="tTyre">
    <div class="lbl"><span>Pneus °C</span><span class="legend"><i style="background:var(--cold)"></i>froid <i style="background:var(--ok)"></i>bon <i style="background:var(--warn)"></i>chaud <i style="background:var(--accent)"></i>trop</span></div>
    <div class="tyres" id="tyres"></div>
  </section>
</main>
</div>

<script>
// Réglages du Race Engineer, partagés par tous les écrans de cet appareil.
// L'onglet ⚙ Réglages les modifie ; les écrans les relisent à chaque mise à jour, donc ça s'applique tout de suite.
const OPTS_DEF = {
  // Écran Course
  warnLaps: 3,        // bannière « Arrêt dans X tours » : combien de tours avant l'arrêt prévu
  boxFlash: true,     // BOX BOX clignotant
  fuelSafety: true,   // BOX BOX « Carburant critique » si l'essence ne tient pas jusqu'à l'arrêt prévu
  // Écran Complet
  radio: true,        // bande radio avec les messages de l'ingénieur
  // Ingénieur vocal
  voiceLapTime: true, // annoncer le temps de chaque tour
  voiceBest: true,    // annoncer les meilleurs tours
  voiceFuelEvery: 3,  // annoncer le carburant restant tous les N tours (0 = jamais)
  voiceRate: 1.05,    // vitesse de la voix
  // Carburant
  consAvg: 5,         // conso moyenne calculée sur les N derniers tours sans arrêt
  fuelWarn: 4,        // jauge jaune sous N tours de carburant
  fuelCrit: 2,        // jauge rouge sous N tours de carburant
  // Pneus (°C)
  tCold: 55,          // en dessous : froid (bleu)
  tHot: 95,           // au-dessus : chaud (jaune)
  tOver: 110,         // au-dessus : trop chaud (rouge)
  slipPct: 15         // blocage / patinage affiché au-delà de ce % (écran Pilote)
};
function opts() {
  try { return Object.assign({}, OPTS_DEF, JSON.parse(localStorage.getItem("gt7-opts") || "{}")); }
  catch (e) { return Object.assign({}, OPTS_DEF); }
}
function saveOpts(o) {
  try { localStorage.setItem("gt7-opts", JSON.stringify(o)); return true; } catch (e) { return false; }
}
function tyreColorOpt(t) {
  const O = opts();
  if (typeof t !== "number" || !isFinite(t)) return "var(--panel-2)";
  return t < O.tCold ? "var(--cold)" : t <= O.tHot ? "var(--ok)" : t <= O.tOver ? "var(--warn)" : "var(--accent)";
}
</script>
<script>
const $=id=>document.getElementById(id);
const fin=x=>typeof x==="number"&&isFinite(x);
const lapFmt=ms=>{if(!fin(ms)||ms<=0)return"–";const m=Math.floor(ms/60000),s=(ms%60000)/1000;return m+":"+s.toFixed(3).padStart(6,"0")};
const f1=x=>fin(x)?(Math.round(x*10)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1}):"–";
const f2=x=>fin(x)?x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}):"–";
const sgnS=ms=>fin(ms)?(ms>0?"+":ms<0?"−":"±")+(Math.abs(ms)/1000).toFixed(3).replace(".",","):"–";
$("tyres").innerHTML=[0,1,2,3].map(i=>`<div class="tyre" id="t${i}">–</div>`).join("");
const cleanLaps=laps=>laps.filter(l=>!l.pit&&fin(l.fuel)&&l.fuel>0.05&&l.ms>0);
const avgFuel=(laps,n)=>{const c=cleanLaps(laps).slice(-n);return c.length?c.reduce((s,l)=>s+l.fuel,0)/c.length:NaN};
const tyreColor=tyreColorOpt;


/* ---- bande radio : le dernier message de l'ingénieur, affiché même sans le son ---- */
let radioT=null;
function radio(text){const r=document.getElementById("radio");if(!r)return;
  document.getElementById("radioText").textContent=text;r.hidden=false;r.classList.remove("old");
  clearTimeout(radioT);radioT=setTimeout(()=>r.classList.add("old"),20000)}
/* ---- ingénieur vocal ---- */
let voiceOn=false,lastSpokenLap=null,fuelWarned=0;
function say(text){if(!voiceOn||!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=+opts().voiceRate||1.05;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("fr"));if(v)u.voice=v;speechSynthesis.speak(u)}
function sayLap(ms){const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),d=Math.floor(ms%1000/100);return`${m} minute${m>1?"s":""} ${s} ${d?"et "+d:""}`.trim()}
$("voiceBtn").addEventListener("click",()=>{voiceOn=!voiceOn;$("voiceBtn").classList.toggle("on",voiceOn);$("voiceBtn").setAttribute("aria-pressed",voiceOn);
  $("voiceBtn").textContent=voiceOn?"🎧 On":"🎧 Off";if(voiceOn)say("Radio check. Je suis avec toi.")});
function engineer(laps,live,lapsLeft,nx){
  // premier contact : message de liaison, sans relire les tours déjà faits
  if(lastSpokenLap===null){lastSpokenLap=laps.length?laps[laps.length-1].n:0;
    const L=live||{};radio(`Liaison radio établie.${L.lap?` Tour ${L.lap} en cours.`:""}${fin(lapsLeft)?` Carburant pour ${Math.floor(lapsLeft)} tours.`:""}`);return}
  if(!laps.length)return;const last=laps[laps.length-1];if(lastSpokenLap===last.n)return;lastSpokenLap=last.n;
  const O=opts(),best=Math.min(...laps.filter(l=>l.ms>0).map(l=>l.ms));
  let t=O.voiceLapTime?`Tour ${last.n}, ${sayLap(last.ms)}.`:"",alert=false;
  if(O.voiceBest&&last.ms===best&&laps.length>1)t+=" Meilleur tour, bravo.";
  if(nx&&!nx.done&&nx.inLaps===0){t+=` Box box, ce tour-ci. ${CN[nx.g]}${nx.stop&&nx.stop.full?`, ${Math.round(nx.stop.add)} litres`:", pneus seuls"}.`;alert=true}
  else if(nx&&!nx.done&&O.warnLaps>0&&nx.inLaps<=O.warnLaps){t+=` Arrêt dans ${nx.inLaps} tour${nx.inLaps>1?"s":""}. On passe en ${CN[nx.g]}.`;alert=true}
  if(fin(lapsLeft)&&!alert){const n=Math.floor(lapsLeft);
    if(n<=1&&O.fuelSafety)t+=" Carburant critique, rentre au stand ce tour-ci.";
    else if(!nx&&n<O.fuelWarn)t+=` Carburant pour ${n} tours. Prépare l'arrêt.`;
    else if(O.voiceFuelEvery>0&&last.n%O.voiceFuelEvery===0)t+=` Carburant pour ${n} tours.`;}
  if(t.trim())say(t.trim());
}


/* ---- plan de la stratégie (enregistré par la page Stratégie sur cet appareil) ---- */
const CN={S:"Soft",M:"Medium",H:"Hard"};
function readPlan(){try{return JSON.parse(localStorage.getItem("gt7-plan")||"null")}catch(e){return null}}
// prochain arrêt : on rentre à la fin du dernier tour d'un relais
function nextStop(lap){const p=readPlan();if(!p||!p.rows||!fin(lap))return null;
  for(let i=0;i<p.rows.length-1;i++){const r=p.rows[i];if(r.to>=lap){const nx=p.rows[i+1];return{inLaps:r.to-lap,endLap:r.to,g:nx.g,stop:nx.stop,n:i+1}}}
  return{done:true}}
function stopTxt(nx){const st=nx.stop||{};return`${CN[nx.g]||nx.g} · ${st.full?"+"+String(st.add).replace(".",",")+" L":"pneus seuls"}`}
function showBox(nx,left){const box=$("box"),O=opts();box.style.animation=O.boxFlash?"":"none";
  if(nx&&!nx.done&&nx.inLaps===0){box.hidden=false;box.className="box crit";$("boxTitle").textContent="Box box";$("boxText").textContent="Ce tour-ci · "+stopTxt(nx)}
  else if(nx&&!nx.done&&O.warnLaps>0&&nx.inLaps<=O.warnLaps){box.hidden=false;box.className="box warn";$("boxTitle").textContent=`Arrêt dans ${nx.inLaps} tour${nx.inLaps>1?"s":""}`;$("boxText").textContent="Prochain relais : "+stopTxt(nx)}
  // sécurité : le carburant ne tiendra pas jusqu'à l'arrêt prévu
  else if(O.fuelSafety&&fin(left)&&left<1.5&&!(nx&&!nx.done&&nx.inLaps<1)){box.hidden=false;box.className="box crit";$("boxTitle").textContent="Box box";$("boxText").textContent="Carburant critique"}
  else if(!nx&&fin(left)&&left<O.fuelWarn){box.hidden=false;box.className="box warn";$("boxTitle").textContent=`Arrêt dans ${Math.floor(left)} tours`;$("boxText").textContent="D'après le carburant"}
  else box.hidden=true}

function render(s){
  const L=s.live||{},laps=s.laps||[],mode=s.mode;
  const st=$("status");st.className="pill "+(mode==="live"?"live":mode==="demo"?"demo":"wait");
  st.textContent=mode==="live"?"En direct":mode==="demo"?"Démo":"En attente";
  $("waitBox").hidden=mode!=="attente";$("tiles").hidden=mode==="attente";
  if(!fin(L.fuel))return;
  // carburant
  const O=opts(),cons=avgFuel(laps,O.consAvg),left=cons>0?L.fuel/cons:NaN,pct=L.fuel_cap>0?L.fuel/L.fuel_cap*100:NaN;
  $("fuelLaps").textContent=fin(left)?f1(left):"–";
  $("fuelLaps").className="huge"+(fin(left)&&left<=O.fuelCrit?" bad":fin(left)&&left<=O.fuelWarn?" wrn":"");
  $("fuelL").textContent=f1(L.fuel)+" L";
  $("gauge").style.width=(fin(pct)?Math.max(0,Math.min(100,pct)):0)+"%";
  $("gauge").style.background=fin(left)&&left<=O.fuelCrit?"var(--accent)":fin(left)&&left<=O.fuelWarn?"var(--warn)":"var(--ok)";
  $("cons").textContent=fin(cons)?f2(cons)+" L/tour":"– L/tour";
  $("raceType").textContent=L.total_laps>0?L.total_laps+" tours":"Durée";
  // bannière d'arrêt : d'après les arrêts prévus par ta stratégie, sinon d'après le carburant
  const nx=nextStop(L.lap);showBox(nx,left);
  // chrono
  $("last").textContent=lapFmt(L.last_ms);$("best").textContent="meilleur "+lapFmt(L.best_ms);
  const d=L.last_ms>0&&L.best_ms>0?L.last_ms-L.best_ms:NaN;
  $("delta").textContent=fin(d)?(d===0?"Meilleur tour":sgnS(d)+" s"):"–";$("delta").className="sub "+(fin(d)&&d<=0?"ok":"bad");
  // course
  $("lap").textContent=L.total_laps>0?`${L.lap}/${L.total_laps}`:L.lap;
  $("lapUnit").textContent=L.total_laps>0?"tours":"tour";
  $("lap").style.setProperty("--lapk",Math.min(1,4/Math.max(1,$("lap").textContent.length)));
  $("pos").textContent=L.pos>0?`P${L.pos}${L.cars>0?" / "+L.cars:""}`:"";
  // pneus
  (L.tyres||[]).forEach((t,i)=>{const el=$("t"+i);el.style.background=tyreColor(t);el.textContent=fin(t)?Math.round(t):"–"});
  engineer(laps,L,left,nextStop(L.lap));
}

function connect(){
  const es=new EventSource("events");
  es.onmessage=e=>{try{render(JSON.parse(e.data))}catch(err){}};
  es.onerror=()=>{$("status").className="pill wait";$("status").textContent="PC injoignable";es.close();setTimeout(connect,2000)};
}
connect();

</script>
</body>
</html>
