plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.razhalpox.gt7engineer'
    compileSdk 36

    defaultConfig {
        // V3 : appli séparée (s'installe à côté de la V2 « GT7 Engineer »)
        applicationId 'fr.razhalpox.simracedash'
        minSdk 24
        targetSdk 36
        // numéro de compilation GitHub : chaque nouvelle version est plus haute que la précédente (mise à jour intégrée)
        def build = (System.getenv('BUILD_NUMBER') ?: '0').toInteger()
        versionCode 3000 + build
        versionName build > 0 ? "3.0.${build}" : "3.0"
    }

    signingConfigs {
        release {
            // clé fournie par GitHub Actions (secret du dépôt)
            def ks = System.getenv('KS_FILE')
            if (ks) {
                storeFile file(ks)
                // espaces ou retour à la ligne collés par erreur autour du secret : ignorés
                def pw = (System.getenv('KS_PASS') ?: '').trim()
                storePassword pw
                keyAlias System.getenv('KS_ALIAS') ?: 'gt7'
                keyPassword pw
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/webassets"
        }
    }
}

// Les écrans viennent du dossier race-engineer/web : une seule version à maintenir.
def copyWeb = tasks.register('copyWeb', Copy) {
    from "$rootDir/../race-engineer/web"
    into "$buildDir/webassets/web"
}
tasks.named('preBuild') { dependsOn copyWeb }
