name: SimRaceDash V3 (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'race-engineer/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Vérifier le secret de signature
        env:
          KS_PASS: ${{ secrets.SRD_KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Le secret SRD_KS_PASS manque (Settings › Secrets and variables › Actions)"; exit 1; fi

      - name: Compiler l'appli
        working-directory: android
        env:
          # clé de signature de SimRaceDash : le fichier est dans le dépôt, son mot de passe est un secret GitHub
          # (Settings › Secrets and variables › Actions › SRD_KS_PASS), invisible pour les visiteurs
          KS_FILE: ${{ github.workspace }}/android/simracedash-release.jks
          KS_PASS: ${{ secrets.SRD_KS_PASS }}
          KS_ALIAS: srd
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk simracedash.apk

      - name: Fiche de version (lue par la mise à jour intégrée)
        env:
          RUN: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c "import json,os;m=(os.environ.get('MSG') or '').split(chr(10))[0];n=int(os.environ['RUN']);json.dump({'versionCode':3000+n,'versionName':'3.0.%d'%n,'notes':m},open('version.json','w'),ensure_ascii=False)"
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: simracedash-apk
          path: simracedash.apk

      - name: Publier le lien de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v3 --yes --cleanup-tag || true
          # version PC : le dossier du relais, prêt à dézipper
          mkdir -p pc/SimRaceDash-PC && cp -r race-engineer/. pc/SimRaceDash-PC/
          rm -rf pc/SimRaceDash-PC/enregistrements pc/SimRaceDash-PC/config.json
          find pc -name "__pycache__" -prune -exec rm -rf {} +
          (cd pc && zip -qr ../SimRaceDash-PC.zip SimRaceDash-PC)
          gh release create v3 simracedash.apk SimRaceDash-PC.zip version.json \
            --title "SimRaceDash V3 (Android et PC)" \
            --notes "SimRaceDash V3 (v3.0.${{ github.run_number }}, compilée depuis ${GITHUB_SHA::7}). Ouvre ce lien sur ton téléphone Android et installe simracedash.apk. Elle remplace l'ancienne appli GT7 Engineer (V2). Version PC Windows : télécharge SimRaceDash-PC.zip." \
            --latest=false
