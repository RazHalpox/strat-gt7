name: SimRaceDash V3 (Android et PC)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'race-engineer/**'
      - 'pc/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Vérifier le secret de signature
        env:
          KS_PASS: ${{ secrets.SRD_KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Le secret SRD_KS_PASS manque (Settings › Secrets and variables › Actions)"; exit 1; fi

      - name: Compiler l'appli
        working-directory: android
        env:
          # clé de signature de SimRaceDash : le fichier est dans le dépôt, son mot de passe est un secret GitHub
          # (Settings › Secrets and variables › Actions › SRD_KS_PASS), invisible pour les visiteurs
          KS_FILE: ${{ github.workspace }}/android/simracedash-release.jks
          KS_PASS: ${{ secrets.SRD_KS_PASS }}
          KS_ALIAS: srd
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk simracedash.apk

      - name: Fiche de version (lue par la mise à jour intégrée)
        env:
          RUN: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c "import json,os;m=(os.environ.get('MSG') or '').split(chr(10))[0];n=int(os.environ['RUN']);json.dump({'versionCode':3000+n,'versionName':'3.0.%d'%n,'notes':m},open('version.json','w'),ensure_ascii=False)"
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            simracedash.apk
            version.json

  # ---- appli PC Windows : SimRaceDash.exe (sans Python à installer) + installateur ----
  pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Outils de compilation
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Numéro de version
        shell: bash
        run: |
          echo "APP_VER=3.0.${{ github.run_number }}" >> $GITHUB_ENV
          sed -i 's/^APP_VERSION = "3.0"/APP_VERSION = "3.0.${{ github.run_number }}"/' race-engineer/simracedash_pc.py
          grep -n "^APP_VERSION" race-engineer/simracedash_pc.py

      - name: Compiler SimRaceDash.exe
        run: >
          pyinstaller --noconfirm --windowed --name SimRaceDash
          --icon pc/simracedash.ico
          --add-data "race-engineer/web;web"
          --paths race-engineer
          --collect-all webview
          race-engineer/simracedash_pc.py

      - name: Vérifier l'appli compilée (serveur, écrans, mode démo)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath "dist\SimRaceDash\SimRaceDash.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA\SimRaceDash\selftest.log" -ErrorAction SilentlyContinue; Write-Error "Le test de SimRaceDash.exe a échoué (code $($p.ExitCode))"; exit 1 }
          Write-Host "SimRaceDash.exe OK"

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "pc\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Version portable (sans installation)
        shell: pwsh
        run: Compress-Archive -Path dist\SimRaceDash -DestinationPath out\SimRaceDash-PC.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: |
            out/SimRaceDash-Setup.exe
            out/SimRaceDash-PC.zip

  # ---- publication : APK + appli PC au même endroit ----
  release:
    needs: [build, pc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true

      - name: Publier le lien de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la art
          gh release delete v3 --yes --cleanup-tag || true
          gh release create v3 art/simracedash.apk art/SimRaceDash-Setup.exe art/SimRaceDash-PC.zip art/version.json \
            --target ${GITHUB_SHA} \
            --title "SimRaceDash V3 (Android et PC)" \
            --notes "SimRaceDash V3 (v3.0.${{ github.run_number }}, compilée depuis ${GITHUB_SHA::7}). Android : installe simracedash.apk sur ton téléphone. PC Windows : télécharge et lance SimRaceDash-Setup.exe (ou SimRaceDash-PC.zip, sans installation)." \
            --latest=false
