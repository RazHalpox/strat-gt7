name: SimRaceDash V3 (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'race-engineer/web/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler l'appli
        working-directory: android
        env:
          # clé de signature de l'appli (toujours la même, pour que les mises à jour s'installent par-dessus)
          KS_FILE: ${{ github.workspace }}/android/gt7-release.jks
          KS_PASS: ppkKTaw6zlDSmHcOb2-7Uklv
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk simracedash.apk

      - name: Fiche de version (lue par la mise à jour intégrée)
        env:
          RUN: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 -c "import json,os;m=(os.environ.get('MSG') or '').split(chr(10))[0];n=int(os.environ['RUN']);json.dump({'versionCode':3000+n,'versionName':'3.0.%d'%n,'notes':m},open('version.json','w'),ensure_ascii=False)"
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: simracedash-apk
          path: simracedash.apk

      - name: Publier le lien de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v3 --yes --cleanup-tag || true
          gh release create v3 simracedash.apk version.json \
            --title "SimRaceDash V3 pour Android" \
            --notes "SimRaceDash V3 (v3.0.${{ github.run_number }}, compilée depuis ${GITHUB_SHA::7}). Ouvre ce lien sur ton téléphone Android et installe simracedash.apk. Elle s'installe à côté de la V2." \
            --latest=false
